require_ci_to_pass: no
max_report_age: off

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 0%

comment:
  layout: "reach,diff,flags,tree,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  show_carryforward_flags: false

github_checks:
  annotations: true
